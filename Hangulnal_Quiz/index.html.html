<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세종대왕의 한글날 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d9a93a; --gold2:#f3d27a; --ink:#2a2118; --red:#b3202a; --ok:#2e8b57; --no:#c0392b;
    --skin:#bd9171;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{font-family:'Gowun Batang','Nanum Myeongjo','Malgun Gothic',serif;color:#fff;-webkit-user-select:none;user-select:none}
  button,input{font-family:inherit}
  .hide{display:none!important}

  #game{position:fixed;inset:0;overflow:hidden;background:#000}
  #game.noTrans *{transition:none!important}

  /* ===== 1. 근정전 (도입부) ===== */
  #exterior{position:absolute;inset:0;overflow:hidden;opacity:0;animation:exIn .8s ease forwards;transition:opacity 1s ease}
  @keyframes exIn{to{opacity:1}}
  #exterior.gone{opacity:0;pointer-events:none}
  #exWorld{position:absolute;inset:0;transform-origin:50% 60%;transition:transform 2.3s cubic-bezier(.55,.05,.35,1)}
  #exWorld.zoom{transform:scale(4.8)}
  #exWorld svg,#bg svg{width:100%;height:100%;display:block}
  #exCap{
    position:absolute;left:4vw;bottom:6vh;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);
    transition:opacity .6s;pointer-events:none
  }
  #exCap b{display:block;font-size:clamp(26px,5vw,56px);letter-spacing:.12em;color:var(--gold2)}
  #exCap span{font-size:clamp(14px,2vw,22px);opacity:.9}
  #exCap.off{opacity:0}
  #skip{
    position:absolute;right:3vw;top:3vh;z-index:30;padding:.5em 1.1em;border-radius:999px;cursor:pointer;
    border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.35);color:#fff;font-size:15px
  }

  /* ===== 2. 어좌 (일월오봉도 + 세종대왕) ===== */
  #interior{position:absolute;inset:0;opacity:0;transform:scale(.86);transform-origin:50% 40%;
    transition:opacity .9s ease, transform 2.6s cubic-bezier(.2,.7,.2,1)}
  #interior.show{opacity:1;transform:none}
  #bg{position:absolute;inset:0}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 38%,transparent 45%,rgba(0,0,0,.55) 100%)}

  .king{position:absolute;left:50%;bottom:0;height:min(100%,140vw);aspect-ratio:629/878;transform:translateX(-50%)}
  .mood{position:relative;width:100%;height:100%;transform-origin:50% 100%;transition:filter .4s}
  .spriteBox{
    position:relative;width:100%;height:100%;transform-origin:50% 100%;animation:breath 6s ease-in-out infinite;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%);
    mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%)
  }
  .spriteBox img{width:100%;height:100%;display:block;pointer-events:none}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
  .king.talking .spriteBox{animation:nod .5s ease-in-out infinite}
  @keyframes nod{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  /* 눈 깜빡임 */
  .pEye{
    position:absolute;width:3.4%;height:1.2%;border-radius:50%;background:var(--skin);
    box-shadow:inset 0 -1.5px 0 rgba(60,38,28,.65);
    transform:translate(-50%,-50%) scaleY(0);transform-origin:50% 30%;pointer-events:none;animation:pBlink 4.6s infinite
  }
  @keyframes pBlink{0%,93%,100%{transform:translate(-50%,-50%) scaleY(0)}96%{transform:translate(-50%,-50%) scaleY(1)}}
  /* 말할 때 입 */
  #pMouth{
    position:absolute;left:50%;top:22.35%;width:2.1%;height:.85%;border-radius:50%;background:#3b1612;opacity:.82;
    transform:translate(-50%,-50%) scaleY(0);pointer-events:none
  }
  .king.talking #pMouth{animation:pTalk .24s ease-in-out infinite alternate}
  @keyframes pTalk{from{transform:translate(-50%,-50%) scaleY(.15)}to{transform:translate(-50%,-50%) scaleY(1)}}
  /* 기분 */
  .king.happy .mood{filter:drop-shadow(0 0 22px rgba(243,210,122,.9))}
  .king.happy:not(.talking) .mood{animation:pYes .9s ease-in-out 3}
  @keyframes pYes{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
  .king.sorry:not(.talking) .mood{animation:pSorry 3s ease-in-out infinite}
  @keyframes pSorry{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(-2deg)}}
  .king.laugh .mood{filter:drop-shadow(0 0 30px rgba(243,210,122,1));animation:pLaugh .35s ease-in-out infinite}
  @keyframes pLaugh{0%,100%{transform:rotate(-1.6deg) translateY(0)}50%{transform:rotate(1.6deg) translateY(-12px)}}

  /* ===== 3. 미연시 대화창 ===== */
  #dlg{
    position:absolute;left:50%;bottom:3vh;transform:translateX(-50%);z-index:20;
    width:min(1120px,94vw);min-height:22vh;padding:3.4vh 2.6vw 2.4vh;border-radius:16px;
    background:linear-gradient(180deg,rgba(14,26,56,.9),rgba(8,14,32,.94));
    border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(243,210,122,.18),0 14px 40px rgba(0,0,0,.55);
    cursor:pointer
  }
  #nameplate{
    position:absolute;left:2vw;top:-2.9vh;padding:.28em 1.5em;border-radius:999px;font-weight:700;
    font-size:clamp(15px,1.9vw,24px);color:#3a2a05;background:linear-gradient(180deg,#f7dc8c,var(--gold));
    border:2px solid #fff3c4;box-shadow:0 4px 12px rgba(0,0,0,.4)
  }
  #nameplate[data-k="rule"]{background:linear-gradient(180deg,#f3a29b,#c0392b);color:#fff}
  #nameplate[data-k="me"]{background:linear-gradient(180deg,#bcd6ff,#5b8bd6);color:#102349}
  #dtext{font-size:clamp(18px,2.3vw,30px);line-height:1.75;word-break:keep-all;min-height:3.2em}
  #dtext .rule b{color:#ffd37a}
  #dtext .rule{font-size:.82em;line-height:1.7}
  #next{position:absolute;right:2vw;bottom:1.6vh;font-size:clamp(18px,2.2vw,28px);color:var(--gold2);animation:bob .9s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(5px)}}

  #hud{position:absolute;right:3vw;top:3vh;z-index:15;padding:.35em 1.1em;border-radius:999px;font-size:clamp(14px,1.8vw,20px);
    color:var(--gold2);border:1px solid var(--gold);background:rgba(8,14,32,.6)}

  /* 문제 카드 / 선택지 / 이름 입력 */
  #qcard{
    position:absolute;z-index:12;left:2.5vw;top:7vh;width:min(28vw,450px);padding:1.6vh 1.4vw 2vh;border-radius:14px;
    background:rgba(255,250,240,.95);color:var(--ink);border:3px double var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.45);
    animation:pop .4s ease
  }
  #qcard .qno{font-size:clamp(13px,1.5vw,18px);color:#8a6a1a;font-weight:700;text-align:center}
  #qcard .qsent{font-size:clamp(20px,2.5vw,34px);font-weight:700;text-align:center;line-height:1.55;margin-top:.4em;word-break:keep-all}
  .blank{display:inline-block;min-width:2.8em;border-bottom:4px solid var(--red);color:var(--red);text-align:center}
  #choices{position:absolute;z-index:12;right:2.5vw;top:22vh;width:min(28vw,450px);animation:pop .4s ease}
  .vnChoice{
    display:block;width:100%;margin:0 0 1.6vh;padding:.8em 1em .8em 1.6em;position:relative;cursor:pointer;text-align:left;
    font-size:clamp(18px,2.2vw,30px);font-weight:700;color:#fff;border-radius:12px;
    background:rgba(12,22,48,.86);border:2px solid var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.45);
    transition:transform .12s, background .2s
  }
  .vnChoice::before{content:"▸";position:absolute;left:.55em;color:var(--gold2)}
  .vnChoice:hover:not(:disabled){transform:translateX(-4px);background:rgba(88,62,10,.92)}
  .vnChoice:disabled{cursor:default}
  .vnChoice.correct{background:rgba(26,110,64,.93);border-color:#7be0a4}
  .vnChoice.wrong{background:rgba(140,32,24,.93);border-color:#ff9c92}
  .vnChoice.dim{opacity:.5}
  #prompt{position:absolute;z-index:14;left:50%;top:44%;transform:translate(-50%,-50%);width:min(560px,90vw);text-align:center;
    padding:2.4vh 2vw;border-radius:16px;background:rgba(12,22,48,.9);border:2px solid var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.55);animation:pop .4s ease}
  #prompt label{display:block;margin-bottom:1.2vh;font-size:clamp(16px,2vw,24px);color:var(--gold2)}
  #prompt input{width:100%;padding:.6em .8em;font-size:clamp(20px,2.6vw,32px);text-align:center;border-radius:12px;border:3px solid var(--gold);background:#fffaf0;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
  #prompt input:focus{box-shadow:0 0 0 4px rgba(243,210,122,.45)}
  #prompt button{margin-top:1.4vh;padding:.55em 1.8em;font-size:clamp(18px,2.2vw,26px);font-weight:700;border-radius:12px;border:3px solid var(--gold);background:linear-gradient(180deg,#f7dc8c,var(--gold));color:#3a2a05;cursor:pointer}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  #prompt{animation:none}

  /* ===== 결과 ===== */
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:50;
    background:rgba(8,14,30,.72);backdrop-filter:blur(3px);padding:16px}
  #overlay.show{display:flex}
  .result{width:min(440px,100%);text-align:center;color:var(--ink);
    background:linear-gradient(180deg,#fffaf0,#fbeecb);border:6px double var(--gold);border-radius:22px;
    padding:26px 22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:resPop .6s cubic-bezier(.2,1.4,.4,1);-webkit-user-select:text;user-select:text}
  @keyframes resPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .result .badge{font-size:44px;line-height:1}
  .result h2{margin:6px 0 2px;font-size:22px;color:var(--red)}
  .result .rname{font-size:30px;font-weight:700;margin:6px 0}
  .result .score{font-size:60px;font-weight:700;color:var(--red);line-height:1.1}
  .result .score small{font-size:28px;color:var(--ink)}
  .marks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
  .marks span{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:17px}
  .marks .o{background:var(--ok)} .marks .x{background:var(--no)}
  .msg{font-size:17px;line-height:1.6;margin:6px 0 10px;word-break:keep-all}
  .stamp{font-size:14px;color:#6b5522;border-top:1px dashed #c9a85a;padding-top:10px;margin-top:8px}
  .cap{margin-top:8px;font-size:15px;font-weight:700;color:#8a1c24}
  #sync{margin-top:6px;font-size:12px;color:#7a6a40}

  /* ===== 좁은 화면(휴대폰·세로) ===== */
  @media (max-width:1000px){
    #qcard{left:50%;top:7vh;transform:translateX(-50%);width:min(92vw,560px);padding:1.2vh 4vw 1.6vh}
    #choices{left:50%;right:auto;top:auto;bottom:calc(3vh + 28vh);transform:translateX(-50%);width:min(92vw,560px)}
    #dlg{min-height:24vh}
    .king{height:min(100%,170vw)}
    @keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}
  }
</style>
</head>

    options:[`웬`,`왠`], answer:`웬`,
    right:`'웬'은 '어찌 된'이라는 뜻의 말이니라. '웬일'처럼 쓰느니라.`,
    wrong:{ '왠':`'왠'은 '왜인지'가 줄어든 '왠지'에만 쓰느니라. '어찌 된 일'의 뜻이니 '웬일'이 맞느니라.` },
    rule:`<b>표준국어대사전</b> — '웬'은 '어찌 된'의 뜻을 나타내는 관형사이다. '왠'은 '왠지'로만 쓴다.` },
  { ask:`올바른 표기를 고르거라.`,
    sentence:`숙제를 <span class="blank">＿＿</span> 끝냈어.`,
    options:[`금세`,`금새`], answer:`금세`,
    right:`'금시에'가 줄어든 말이 '금세'이니라. '지금 바로'라는 뜻이니라.`,
    wrong:{ '금새':`'금새'는 물건의 값을 뜻하는 다른 말이니라. '지금 바로'의 뜻은 '금세'로 적느니라.` },
    rule:`<b>표준국어대사전</b> — '금세'는 '금시에'가 줄어든 말이다. '금새'는 물건의 비싸고 싼 정도를 뜻하는 말이다.` },
  { ask:`뜻을 잘 가려서 고르거라.`,
    sentence:`감기가 빨리 <span class="blank">＿＿</span> 좋겠다.`,
    options:[`나으면`,`낳으면`], answer:`나으면`,
    right:`병이 없어진다는 뜻은 '낫다'이니라. 'ㅅ' 받침이 모음 어미 앞에서 사라져 '나으면'이 되느니라.`,
    wrong:{ '낳으면':`'낳다'는 아이나 새끼를 배 밖으로 내놓는다는 뜻이니라. 병이 없어지는 것은 '낫다'이니 '나으면'이 맞느니라.` },
    rule:`<b>한글 맞춤법 제18항 2</b> — 어간의 끝 'ㅅ'이 줄어질 적에는 준 대로 적는다. (낫다→나으면·나아, 긋다→그어)` },
  { ask:`올바른 표기를 고르거라.`,
    sentence:`나는 거짓말을 하지 <span class="blank">＿＿</span>았다.`,
    options:[`않`,`안`], answer:`않`,
    right:`'않'은 '아니하다'의 준말 '않다'의 어간이니라. '-지' 뒤에는 '않-'을 쓰느니라.`,
    wrong:{ '안':`'안'은 '아니'의 준말로 동사 바로 앞에서 쓰는 말이니라. ('안 먹었다') '-지' 뒤에는 '않-'을 써서 '먹지 않았다'로 적느니라.` },
    rule:`<b>표준국어대사전</b> — '않다'는 '아니하다'의 준말, '안'은 '아니'의 준말(부사)이다. '-지' 뒤에는 '않-'을 쓴다.` },
  { ask:`올바른 표기를 고르거라.`,
    sentence:`친구를 <span class="blank">＿＿</span> 만났다.`,
    options:[`오랜만에`,`오랫만에`], answer:`오랜만에`,
    right:`'오래간만'이 줄어든 말이 '오랜만'이니라.`,
    wrong:{ '오랫만에':`'오랫'처럼 사이시옷을 받치면 아니 되느니라. '오래간만'의 준말이니 '오랜만'으로 적느니라.` },
    rule:`<b>표준국어대사전</b> — '오랜만'은 '오래간만'의 준말이다.` },
  { ask:`'율'과 '률'을 가려 보거라.`,
    sentence:`이 팀은 성공<span class="blank">＿＿</span>이 높다.`,
    options:[`률`,`율`], answer:`률`,
    right:`'성공'은 'ㅇ' 받침으로 끝나니 '률'로 적느니라. 모음이나 'ㄴ' 받침 뒤에서만 '율'을 쓰느니라.`,
    wrong:{ '율':`'율'은 앞말이 모음이나 'ㄴ' 받침으로 끝날 때만 쓰느니라. (비율, 백분율) '성공'은 'ㅇ' 받침이니 '률'이 맞느니라.` },
    rule:`<b>한글 맞춤법 제11항 붙임 1</b> — 모음이나 'ㄴ' 받침 뒤에 이어지는 '렬, 률'은 '열, 율'로 적는다. (비율, 백분율, 실패율 등)` },
  { ask:`올바른 표기를 고르거라.`,
    sentence:`그 말을 듣고 <span class="blank">＿＿</span>없어서 웃음이 났다.`,
    options:[`어이`,`어의`], answer:`어이`,
    right:`'어이없다'가 하나의 낱말이니라. 일이 너무 엄청나 기가 막히다는 뜻이니라.`,
    wrong:{ '어의':`'어의'는 '말의 뜻'이나 '임금을 돌보던 의원'을 가리키는 말이라 여기에는 어울리지 아니하느니라. 기가 막힐 때는 '어이없다'로 적느니라.` },
    rule:`<b>표준국어대사전</b> — '어이없다'는 일이 너무 엄청나 기가 막히는 듯하다는 뜻의 한 낱말이다.` },
  { ask:`올바른 표기를 고르거라.`,
    sentence:`내 <span class="blank">＿＿</span>은 네가 행복한 거야.`,
    options:[`바람`,`바램`], answer:`바람`,
    right:`'바라다'의 어간 '바라-'에 'ㅁ'이 붙어 '바람'이 되느니라.`,
    wrong:{ '바램':`'바래다'는 빛이 변한다는 뜻의 다른 말이니라. 소망의 뜻은 '바라다'에서 나온 '바람'이니라.` },
    rule:`<b>한글 맞춤법 제19항 1</b> — 어간에 '-이'나 '-음/-ㅁ'이 붙어서 명사로 된 것은 그 어간의 원형을 밝히어 적는다. (바라다→바람, 얼음, 믿음 등)` },
  { ask:`뜻을 잘 가려서 고르거라.`,
    sentence:`산 <span class="blank">＿＿</span>에 작은 마을이 있다.`,
    options:[`너머`,`넘어`], answer:`너머`,
    right:`산 저쪽의 공간을 가리킬 때는 명사 '너머'를 쓰느니라.`,
    wrong:{ '넘어':`'넘어'는 '넘다'의 활용형으로 동작을 나타내느니라. ('산을 넘어 간다') 저쪽의 공간을 가리킬 때는 '너머'이니라.` },
    rule:`<b>표준국어대사전</b> — '너머'는 높은 것의 저쪽 공간을 뜻하는 명사이고, '넘어'는 동사 '넘다'의 활용형이다.` },
  { ask:`올바른 표기를 고르거라.`,
    sentence:`내일 학교에서 <span class="blank">＿＿</span>요!`,
    options:[`봬`,`뵈`], answer:`봬`,
    right:`'뵈어요'가 줄어든 말이 '봬요'이니라. '되어요→돼요'와 같은 이치이니라.`,
    wrong:{ '뵈':`'뵈'는 어간일 뿐이라 '요'가 바로 붙을 수 없느니라. '뵈어요'를 줄이면 '봬요'가 되느니라.` },
    rule:`<b>한글 맞춤법 제35항 붙임 2</b> — 'ㅚ' 뒤에 '-어, -었-'이 어울려 'ㅙ, ㅙㅆ'으로 될 적에도 준 대로 적는다. (뵈어요→봬요)` }
];

/* =====================  도우미  ===================== */
const $ = s => document.querySelector(s);
const game = $('#game'), king = $('#king'), dlg = $('#dlg'), dtext = $('#dtext'), nameplate = $('#nameplate'), nextEl = $('#next');
const choicesEl = $('#choices'), qcard = $('#qcard'), promptEl = $('#prompt'), hud = $('#hud');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hasBatchim = n => { const c = (n||'').trim().slice(-1).charCodeAt(0); return c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28!==0; };
const josaCall = n => hasBatchim(n) ? '아' : '야';   // 성주야 / 민준아
const josaGa   = n => hasBatchim(n) ? '이' : '가';   // 성주가 / 민준이
const ordinals = ['첫 번째','두 번째','세 번째','네 번째','다섯 번째','여섯 번째','일곱 번째','여덟 번째','아홉 번째','열 번째','열한 번째','열두 번째','열세 번째','열네 번째','열다섯 번째'];
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const escapeHtml = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setMood(m){ king.classList.remove('happy','sorry','laugh'); if (m) king.classList.add(m); }

/* ---- 미연시식 대화: 글자가 한 자씩 나오고, 클릭/스페이스/엔터로 넘김 ---- */
let typingFinish = null, advanceFn = null;
function say(text, {who='세종대왕', mood, wait=true, html=false, speed=38} = {}) {
  return new Promise(resolve => {
    dlg.classList.remove('hide');
    nameplate.textContent = who;
    nameplate.dataset.k = who === '세종대왕' ? 'king' : (who === '근거' ? 'rule' : 'me');
    nextEl.classList.add('hide');
    if (mood !== undefined) setMood(mood);
    let timer = null;
    const done = () => {
      typingFinish = null; clearInterval(timer); king.classList.remove('talking');
      if (html) dtext.innerHTML = text; else dtext.textContent = text;
      if (wait) {
        nextEl.classList.remove('hide');
        advanceFn = () => { advanceFn = null; nextEl.classList.add('hide'); resolve(); };
      } else resolve();
    };
    if (html) { done(); return; }
    const chars = [...text]; let i = 0;
    dtext.textContent = '';
    if (who === '세종대왕') king.classList.add('talking');
    typingFinish = done;
    timer = setInterval(() => { i++; dtext.textContent = chars.slice(0, i).join(''); if (i >= chars.length) done(); }, speed);
  });
}
function handleAdvance(){ if (typingFinish) { typingFinish(); return; } if (advanceFn) advanceFn(); }
game.addEventListener('click', e => { if (e.target.closest('button,input,form,#overlay')) return; handleAdvance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !/INPUT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); handleAdvance(); }
});

/* ---- 선택지 / 이름 입력 ---- */
function pickFrom(options) {
  return new Promise(resolve => {
    choicesEl.innerHTML = ''; choicesEl.classList.remove('hide');
    const btns = options.map(o => { const b = document.createElement('button'); b.className = 'vnChoice'; b.textContent = o; choicesEl.appendChild(b); return b; });
    btns.forEach(b => b.addEventListener('click', () => resolve({btn:b, btns}), {once:true}));
  });
}
function askName() {
  return new Promise(resolve => {
    promptEl.innerHTML = `<form><label for="nameIn">이름을 적어 주거라</label><input id="nameIn" type="text" maxlength="10" autocomplete="off" placeholder="이름"><br><button type="submit">대답하기</button></form>`;
    promptEl.classList.remove('hide');
    const f = promptEl.querySelector('form'), inp = promptEl.querySelector('input');
    inp.focus();
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = inp.value.trim();
      if (!v) { inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400); inp.focus(); return; }
      promptEl.classList.add('hide'); resolve(v);
    });
  });
}

/* =====================  도입부: 근정전 → 어좌  ===================== */
let skipped = false;
const skipP = new Promise(r => $('#skip').addEventListener('click', () => { skipped = true; r(); }));
const sleepI = ms => Promise.race([sleep(ms), skipP]);

async function intro() {
  const img = $('#spriteImg');
  img.src = SPRITE_URL;
  try { await img.decode(); } catch (e) {}
  await sleepI(800 + 500);                  // 근정전 전경이 나오고 0.5초 뒤
  if (!skipped) {
    $('#exWorld').classList.add('zoom');      // 클로즈업
    $('#exCap').classList.add('off');
    await sleepI(1500);
  }
  if (skipped) game.classList.add('noTrans');
  $('#interior').classList.add('show');
  $('#exterior').classList.add('gone');
  if (!skipped) await sleepI(2300);
  $('#skip').classList.add('hide');
  game.classList.remove('noTrans');
}

/* =====================  진행  ===================== */
async function main() {
  await intro();

  await say('너는 누구냐?', {wait:false});
  const name = await askName();
  await say(`그래, ${name}${josaCall(name)}. 10월 9일이 무슨 날인지 아느냐?`, {wait:false});

  let r = await pickFrom(['10월 9일은 한글날입니다']);
  choicesEl.classList.add('hide');
  await say('10월 9일은 한글날입니다.', {who:name, wait:false, speed:28});
  await sleep(700);
  await say(`그래, 잘 알고 있구나 허허허. 그럼 우리 ${name}${josaGa(name)} 한글을 잘 알고 있는지 시험을 해보자꾸나`, {mood:'happy'});

  const results = await runQuiz(name);
  await finish(name, results);
}

async function runQuiz(name) {
  const results = [];
  hud.classList.remove('hide');
  for (let i = 0; i < QUESTIONS.length; i++) {
    const q = QUESTIONS[i];
    hud.textContent = `문제 ${i+1} / ${QUESTIONS.length}`;
    qcard.innerHTML = `<div class="qno">제 ${i+1} 문</div><div class="qsent">${q.sentence}</div>`;
    qcard.classList.remove('hide');
    choicesEl.classList.add('hide');

    await say(`${i === QUESTIONS.length-1 ? '마지막' : ordinals[i]} 문제다. ${q.ask}`, {mood:null, wait:false});
    const {btn, btns} = await pickFrom(shuffle(q.options));
    const choice = btn.textContent, ok = choice === q.answer;
    btns.forEach(b => {
      b.disabled = true;
      if (b.textContent === q.answer) b.classList.add('correct');
      else if (b === btn) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    results.push(ok ? 'O' : 'X');

    await say(`“${choice}”`, {who:name, wait:false, speed:30});
    await sleep(650);

    const mood = ok ? 'happy' : 'sorry';
    if (ok) {
      await say(`옳거니! 정답이다 ${name}${josaCall(name)}. '${q.answer}'이(가) 맞느니라.`, {mood});
      await say(q.right, {mood});
    } else {
      await say(`허허, 아쉽구나 ${name}${josaCall(name)}. 정답은 '${q.answer}'이니라.`, {mood});
      if (q.wrong[choice]) await say(q.wrong[choice], {mood});
      await say(q.right, {mood});
    }
    await say(`<div class="rule">📖 국립국어원 ${q.rule}</div>`, {who:'근거', html:true});
  }
  hud.classList.add('hide'); qcard.classList.add('hide'); choicesEl.classList.add('hide');
  return results;
}

async function finish(name, results) {
  const score = results.filter(r => r === 'O').length;
  const total = results.length;

  await say(`잘하였다. ${name}${josaCall(name)}. 이렇게 계속 한글을 아끼고 사랑하며 소중하게 여겨줬으면 좋겠다 허허허`, {mood:'happy', wait:false});
  setMood('laugh');
  await sleep(2200);
  setMood(null);

  const msg = score === total ? '모든 문제를 맞혔으니 참으로 장하구나!'
            : score >= total*0.7 ? '한글 사랑이 대단하구나!'
            : score >= total*0.4 ? '조금만 더 살펴보면 훌륭해지겠구나!'
            : '틀린 문제를 다시 살펴보면 금세 나아지리라!';
  const now = new Date();
  const dateStr = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  $('#result').innerHTML = `
    <div class="badge">${score===total?'🏆':'🎖️'}</div>
    <h2>세종대왕의 한글날 퀴즈</h2>
    <div class="rname">${escapeHtml(name)}</div>
    <div class="score">${score}<small> / ${total}</small></div>
    <div class="marks">${results.map((r,i)=>`<span class="${r==='O'?'o':'x'}" title="${i+1}번">${r}</span>`).join('')}</div>
    <div class="msg">${msg}</div>
    <div class="stamp">훈민정음 · 한글날 퀴즈 완료<br>${dateStr}</div>
    <div class="cap">📸 이 화면을 캡처해서 제출하세요</div>
    <div id="sync"></div>`;
  $('#overlay').classList.add('show');
  sendToSheet(name, results, score, total);
}

function sendToSheet(name, results, score, total) {
  const el = $('#sync');
  if (!SHEET_URL) { el.textContent = '(시트 주소가 설정되지 않아 기록은 저장되지 않았습니다)'; return; }
  el.textContent = '기록을 보내는 중…';
  fetch(SHEET_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({name, results, score, total})
  }).then(() => { el.textContent = '✔ 기록이 전송되었습니다'; })
    .catch(() => { el.textContent = '⚠ 기록 전송에 실패했습니다. 인터넷 연결을 확인해 주세요.'; });
}

main();
</script>
